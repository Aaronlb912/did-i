<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
/* One short video, driven by ?v=meds|stove|door. Every animation is paused and
   scrubbed frame by frame by render.mjs, so timing is exact. */
:root{--bg:#0e1014;--panel:#16191f;--line:#2b3140;--ink:#f4f6fa;--soft:#a3abb8;--on:#c9f24d;--no:#3a3f4b}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
*{animation-play-state:paused!important;animation-fill-mode:both!important}
.glow{position:absolute;inset:0;background:radial-gradient(900px 800px at 20% 0%,rgba(201,242,77,.13),transparent 60%),radial-gradient(800px 800px at 100% 100%,rgba(120,90,255,.12),transparent 60%)}
.scene{position:absolute;inset:0}

/* 1. Hook */
.hook{position:absolute;left:90px;right:90px;top:560px;font-weight:800;font-size:92px;line-height:1.08;letter-spacing:-.02em;animation:hookIn .7s ease-out 0s,hookOut .5s ease-in 3.3s}
.hook .w{display:inline-block;opacity:0;animation:word .35s ease-out}
.hook em{font-style:normal;color:var(--on)}
@keyframes hookIn{from{transform:translateY(40px)}to{transform:none}}
@keyframes hookOut{to{opacity:0;transform:translateY(-60px)}}
@keyframes word{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* 2. Phone */
.phone{position:absolute;left:150px;top:300px;width:780px;height:1600px;border-radius:110px;background:#05060a;border:16px solid #1d222d;box-shadow:0 40px 120px rgba(0,0,0,.5);overflow:hidden;opacity:0;animation:phoneIn .8s cubic-bezier(.2,.8,.2,1) 3.6s,phoneOut .5s ease-in 8.3s}
@keyframes phoneIn{from{opacity:0;transform:translateY(260px)}to{opacity:1;transform:none}}
@keyframes phoneOut{to{opacity:0;transform:scale(.94)}}
.bar{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;font:700 34px Inter}
.island{width:210px;height:58px;background:#000;border-radius:99px}
.app{padding:24px 44px}
.head{display:flex;justify-content:space-between;font:700 26px 'JetBrains Mono';letter-spacing:.14em;color:var(--soft)}
.count{position:relative;margin-top:34px;font:800 76px Inter}.count b{display:inline-block;font:inherit}.count .n2{animation:numOut .25s ease-in 6.0s}.count .n3{position:absolute;left:0;top:0;opacity:0;animation:numIn .3s ease-out 6.1s}@keyframes numOut{to{opacity:0;transform:translateY(-20px)}}@keyframes numIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}.count span{font:700 26px 'JetBrains Mono';color:var(--soft);letter-spacing:.14em;margin-left:14px}
.prog{margin-top:18px;height:12px;border-radius:9px;background:#2b3140;overflow:hidden}
.prog i{display:block;height:100%;width:33%;background:var(--on);animation:prog .5s ease-out 6.0s}
@keyframes prog{to{width:50%}}
.stack{position:relative;margin-top:300px;height:360px}
.card{position:absolute;inset:0;border-radius:44px;background:var(--panel);border:3px solid var(--line);padding:46px 44px;display:flex;flex-direction:column;gap:22px}
.card .k{font:700 26px 'JetBrains Mono';letter-spacing:.16em;color:var(--on);text-transform:uppercase}
.card .q{font:800 64px Inter;line-height:1.08}
.card .dots{margin-top:auto;display:flex;gap:16px}.card .dots i{width:22px;height:22px;border-radius:50%;background:var(--on)}.card .dots i.o{background:#2b3140}
.next{transform:scale(.94) translateY(26px);opacity:.6;animation:nextUp .4s ease-out 6.0s}
@keyframes nextUp{to{transform:none;opacity:1}}
.top{animation:swipe 1.3s cubic-bezier(.4,0,.2,1) 4.9s}
@keyframes swipe{0%{transform:none}55%{transform:translateX(150px) rotate(6deg)}100%{transform:translateX(1100px) rotate(20deg)}}
.stamp{position:absolute;top:34px;left:40px;background:var(--panel);font:800 44px Inter;letter-spacing:.06em;color:var(--on);border:5px solid var(--on);border-radius:16px;padding:4px 18px;transform:rotate(-8deg);opacity:0;animation:stamp .6s ease-out 5.3s}
@keyframes stamp{0%{opacity:0;transform:rotate(-8deg) scale(1.4)}40%,100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.rail{position:absolute;right:-16px;top:300px;width:84px;height:360px;border-radius:84px 0 0 84px;background:var(--on);color:var(--bg);display:flex;align-items:center;justify-content:center;font:800 28px Inter;letter-spacing:.2em;opacity:0;animation:rail 1.3s ease-out 4.9s}
.rail span{transform:rotate(-90deg)}
@keyframes rail{0%{opacity:0;transform:translateX(60px)}35%,70%{opacity:1;transform:none}100%{opacity:0}}
.thumb{position:absolute;left:330px;top:600px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 18px rgba(255,255,255,.18);opacity:0;animation:thumb 1.5s ease-in-out 4.6s}
@keyframes thumb{0%{opacity:0}20%{opacity:1;transform:none}60%{opacity:1;transform:translateX(160px)}80%,100%{opacity:0;transform:translateX(220px)}}
.toast{position:absolute;left:44px;right:44px;top:1170px;text-align:center;font:700 34px Inter;color:var(--soft);opacity:0;animation:toast .5s ease-out 6.2s}
@keyframes toast{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.tabs{position:absolute;left:30px;right:30px;bottom:40px;height:120px;border-radius:70px;background:#16191f;display:flex;padding:12px;gap:12px}
.tabs b{flex:1;border-radius:60px;display:flex;align-items:center;justify-content:center;font:700 32px Inter;color:var(--soft)}.tabs b.on{background:var(--on);color:var(--bg)}

/* 3. Widget */
.wscene{opacity:0;animation:wIn .6s ease-out 8.6s,wOut .5s ease-in 11.0s}
@keyframes wIn{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
@keyframes wOut{to{opacity:0}}
.wcap{position:absolute;left:90px;right:90px;top:250px;font:800 84px Inter;line-height:1.08;letter-spacing:-.02em}
.wcap em{font-style:normal;color:var(--on)}
.widget{position:absolute;left:120px;right:120px;top:760px;height:560px;border-radius:84px;background:var(--panel);border:7px solid var(--on);padding:60px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.widget .k{font:700 36px Inter;letter-spacing:.08em;color:var(--on);text-transform:uppercase}
.widget .q{font:800 76px Inter;text-align:center;line-height:1.1}
.wb{display:flex;gap:26px;width:100%}
.wb span{flex:1;text-align:center;border-radius:34px;padding:30px 0;font:800 48px Inter}
.wno{background:var(--no)}.wdid{background:var(--on);color:var(--bg);animation:press .5s ease-out 9.6s}
@keyframes press{40%{transform:scale(.92)}100%{transform:none}}
.wdone{position:absolute;inset:0;border-radius:78px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;opacity:0;animation:done .4s ease-out 9.9s}
.wdone .c{width:170px;height:170px;border-radius:50%;background:var(--on);color:var(--bg);display:flex;align-items:center;justify-content:center;font:800 110px Inter}
.wdone .t{font:800 54px Inter}.wdone .s{font:700 34px Inter;color:var(--soft)}
@keyframes done{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* 4. End card */
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;opacity:0;animation:endIn .7s ease-out 11.3s}
@keyframes endIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.end img{width:240px;height:240px;border-radius:56px}
.end h1{font:800 104px Inter;text-align:center;line-height:1.05;letter-spacing:-.02em}
.end h1 em{font-style:normal;color:var(--on)}
.end p{font:700 46px 'JetBrains Mono';color:var(--soft);letter-spacing:.04em}
</style></head>
<body>
<div class="glow"></div>
<div class="scene"><div class="hook" id="hook"></div></div>
<div class="phone">
  <div class="bar"><span>9:41</span><span class="island"></span><span>●●●</span></div>
  <div class="app">
    <div class="head"><span>DID I · TONIGHT</span><span>● 42</span></div>
    <div class="count" id="count"><b class="n2">2</b><b class="n3">3</b><span>OF 6</span></div>
    <div class="prog"><i></i></div>
    <div class="stack">
      <div class="card next"><span class="k" id="k2"></span><div class="q" id="q2"></div><div class="dots"><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i></div></div>
      <div class="card top"><span class="k" id="k1"></span><div class="q" id="q1"></div><div class="dots"><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i></div><span class="stamp">DID</span></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="rail"><span>DID</span></div>
  <div class="thumb"></div>
  <div class="tabs"><b class="on">Home</b><b>Questions</b></div>
</div>
<div class="scene wscene">
  <div class="wcap">Next time you wonder,<br><em>just look.</em></div>
  <div class="widget"><span class="k" id="wk"></span><div class="q" id="wq"></div><div class="wb"><span class="wno">Not yet</span><span class="wdid">Did</span></div>
    <div class="wdone"><div class="c">✓</div><div class="t" id="wt"></div><div class="s" id="ws"></div></div></div>
</div>
<div class="end"><img id="icon"><h1>Did I?<br><em>Now you’ll know.</em></h1><p>did-i.app</p></div>
<script>
const V = {
  meds: { hook: 'POV: you’re 10 minutes from home and can’t remember if you <em>took your meds.</em>', k: 'Health', q: 'Did I take my pills?', k2: 'Home', q2: 'Did I lock the back door?', toast: 'Pills: done at 8:02 PM', wt: 'Pills: done', ws: '8:02 PM' },
  stove: { hook: 'ADHD tax: driving back home to check <em>the stove.</em> Again.', k: 'Home', q: 'Did I turn off the stove?', k2: 'Home', q2: 'Did I feed the cat?', toast: 'Stove: done at 7:41 PM', wt: 'Stove: done', ws: '7:41 PM' },
  door: { hook: 'My brain at 11pm: did I lock the door? Also my brain: <em>no idea.</em>', k: 'Home', q: 'Did I lock the back door?', k2: 'Health', q2: 'Did I take my pills?', toast: 'Back door: done at 10:58 PM', wt: 'Back door: done', ws: '10:58 PM' },
}[new URLSearchParams(location.search).get('v') || 'meds']
// Words fade in one after another.
const hook = document.getElementById('hook')
hook.innerHTML = V.hook.replace(/(<em>.*?<\/em>|\S+)/g, (w) => `<span class="w">${w}</span>`)
;[...hook.querySelectorAll('.w')].forEach((el, i) => (el.style.animationDelay = (0.25 + i * 0.12).toFixed(2) + 's'))
for (const [id, key] of [['k1', 'k'], ['q1', 'q'], ['k2', 'k2'], ['q2', 'q2'], ['toast', 'toast'], ['wt', 'wt'], ['ws', 'ws'], ['wk', 'k'], ['wq', 'q']]) document.getElementById(id).textContent = V[key]
document.getElementById('icon').src = new URLSearchParams(location.search).get('icon') || ''
// render.mjs calls this for each frame.
window.seek = (t) => { for (const a of document.getAnimations()) a.currentTime = t * 1000 }
window.seek(0)
</script>
</body></html>
