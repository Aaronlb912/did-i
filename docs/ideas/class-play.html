<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Did I Classes Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#0a0c10;--bg:#0e1014;--panel:#16191f;--panel2:#1d212a;--line:#2b3140;--ink:#f4f6fa;--soft:#a3abb8;--dim:#6b7484;--on:#c9f24d;--onInk:#111;--late:#ffd166;--miss:#ff7a6b;--exc:#8fb3ff;--open:#3a4152}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#e6e9de;--bg:#eef1e6;--panel:#fff;--panel2:#f4f6ee;--line:#d9ddd0;--ink:#15171c;--soft:#5b6270;--dim:#8a909b;--on:#7fa21a;--onInk:#fff;--late:#b7860b;--miss:#c8473a;--exc:#3d6fd6;--open:#cfd4c6}}
:root[data-theme="light"]{--page:#e6e9de;--bg:#eef1e6;--panel:#fff;--panel2:#f4f6ee;--line:#d9ddd0;--ink:#15171c;--soft:#5b6270;--dim:#8a909b;--on:#7fa21a;--onInk:#fff;--late:#b7860b;--miss:#c8473a;--exc:#3d6fd6;--open:#cfd4c6}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);font:500 15px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar b{font:800 16px Inter}.bar .kick{font:700 10px 'JetBrains Mono';letter-spacing:.16em;color:var(--on)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{padding:6px 12px;border-radius:99px;font:700 13px Inter;color:var(--soft)}.seg button.on{background:var(--on);color:var(--onInk)}
.night{font:700 12px 'JetBrains Mono';color:var(--soft)}
.sp{flex:1}
.btn{background:var(--on);color:var(--onInk);border-radius:99px;padding:9px 16px;font:800 13px Inter;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.cols{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}.cols>.phone{order:-1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;min-width:0}
.k{font:700 10px 'JetBrains Mono';letter-spacing:.16em;color:var(--on);text-transform:uppercase}
h2{font:800 20px/1.2 Inter}h3{font:800 16px/1.25 Inter}
.soft{color:var(--soft);font-size:13px}.dim{color:var(--dim);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list{display:grid;gap:8px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-width:0}
.item.on{outline:2px solid var(--on)}
.item .grow{flex:1;min-width:0}.item .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
label.f{display:grid;gap:4px;font:600 12px Inter;color:var(--soft)}
input[type=text],input[type=url],select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=checkbox]{accent-color:var(--on);width:16px;height:16px}
.chk{display:flex;gap:8px;align-items:center;font:600 13px Inter}
.pre{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding-left:10px}
.pre span{font-weight:700;white-space:nowrap}.pre input{border:0;background:transparent}
.days{display:flex;gap:4px;flex-wrap:wrap}.days label{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:700 12px Inter;display:flex;gap:4px;align-items:center}
.preview{background:var(--panel2);border-left:3px solid var(--on);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--soft)}
.tot{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--open)}
.tot i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:600 12px Inter;color:var(--soft)}
.legend span{display:flex;gap:4px;align-items:center}.legend i{width:9px;height:9px;border-radius:50%;display:block}
.st{font:700 11px Inter;border-radius:99px;padding:3px 8px;white-space:nowrap;border:1px solid}
.st.did{color:var(--on);border-color:var(--on)}.st.late{color:var(--late);border-color:var(--late)}.st.didnt{color:var(--miss);border-color:var(--miss)}.st.excused{color:var(--exc);border-color:var(--exc)}.st.open{color:var(--soft);border-color:var(--line)}
.roster{display:grid;gap:4px;max-height:420px;overflow:auto}
.rrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 8px;border-radius:10px}
.rrow:nth-child(odd){background:var(--panel2)}
.rrow .grow{flex:1 1 110px;min-width:0;font:600 13px Inter;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font:700 11px Inter;color:var(--soft);text-decoration:underline;padding:2px 4px}
.code{font:700 26px 'JetBrains Mono';letter-spacing:.08em;color:var(--on)}
.qr{width:96px;height:96px;display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:#fff;padding:6px;border-radius:8px}
.qr i{background:#111;display:block}.qr i.w{background:#fff}
.pro{font:800 10px Inter;background:var(--late);color:#111;border-radius:6px;padding:1px 5px;margin-left:4px}
.empty{color:var(--soft);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:14px;font-size:13px}
/* Student phone */
.phone{width:min(360px,100%);margin:0 auto;background:var(--bg);border:8px solid #1d222d;border-radius:40px;min-height:640px;padding:18px 16px;display:grid;gap:12px;align-content:start;position:relative;overflow:hidden}
.phone .hd{display:flex;justify-content:space-between;align-items:center;font:700 10px 'JetBrains Mono';letter-spacing:.14em;color:var(--soft)}
.count{font:800 34px Inter}.count span{font:700 10px 'JetBrains Mono';color:var(--soft);letter-spacing:.14em;margin-left:6px}
.meter{height:7px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--on);transition:width .3s}
.stack{position:relative;height:250px}
.qcard{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:8px;align-content:start;touch-action:none;user-select:none;cursor:grab;transition:transform .25s ease,opacity .25s}
.qcard.drag{transition:none;cursor:grabbing}
.qcard .q{font:800 22px/1.2 Inter}
.tag{display:inline-flex;gap:6px;align-items:center;font:700 11px Inter;border:1px solid var(--line);border-radius:99px;padding:3px 9px;width:max-content}
.stamp{position:absolute;pointer-events:none;top:16px;right:16px;font:800 16px Inter;border:3px solid;border-radius:10px;padding:0 8px;opacity:0;transform:rotate(8deg)}
.stamp.did{color:var(--on);border-color:var(--on)}.stamp.nope{color:var(--miss);border-color:var(--miss);left:16px;right:auto;transform:rotate(-8deg)}
.answers{display:flex;gap:10px}.answers button{flex:1}
.done{text-align:center;display:grid;gap:6px;padding:30px 10px}
.done b{font:800 22px Inter}
.widget{border:3px solid var(--on);border-radius:22px;background:var(--panel);padding:12px;display:grid;gap:2px;justify-items:center;text-align:center;width:150px}
.widget .k{font-size:9px}.widget b{font:800 13px/1.2 Inter}
.toast{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.flame{color:var(--on);font-weight:800}
.shields{display:flex;gap:4px}.shields i{width:14px;height:16px;border-radius:4px 4px 8px 8px;background:var(--exc);display:block}.shields i.used{background:var(--line)}
.tabs{display:flex;gap:6px;background:var(--panel);border-radius:99px;padding:4px}
.tabs button{flex:1;padding:8px;border-radius:99px;font:700 12px Inter;color:var(--soft)}.tabs button.on{background:var(--on);color:var(--onInk)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
.promise{font-size:12.5px;color:var(--soft);background:var(--panel2);border-radius:10px;padding:10px}
.appbar{display:flex;align-items:center;gap:10px;min-height:34px}.appbar b{font:800 20px Inter;flex:1}.appbar .purse{font:700 11px 'JetBrains Mono';color:var(--soft)}
.icon{width:34px;height:34px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:800 16px Inter}
.back{font:700 14px Inter;color:var(--on)}
.nav{display:flex;gap:6px;background:var(--panel);border-radius:22px;padding:5px;margin-top:6px}.nav button{flex:1;padding:9px;border-radius:18px;font:700 12px Inter;color:var(--soft)}.nav button.on{background:var(--panel2);color:var(--on)}
.menu{display:grid;gap:6px}.menu button{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font:700 14px Inter;text-align:left}.menu button span{flex:1}.menu .new{font:800 9px Inter;background:var(--on);color:var(--onInk);border-radius:6px;padding:1px 5px;font-style:normal}.menu button.stub{opacity:.5;cursor:default}
.phone .card{padding:12px;border-radius:16px}.phone .cols{display:block}
.note{font-size:12px;color:var(--dim);text-align:center}
@media (prefers-reduced-motion:reduce){.qcard,.meter i{transition:none}}
</style></head>
<body>
<div class="bar">
  <div><div class="kick">Prototype · classes inside Did I · saved in this browser</div><b>Did I · classes</b></div>
  <div class="seg" role="tablist" aria-label="View as">
    <button data-act="role" data-v="teacher">Teacher's phone</button>
    <button data-act="role" data-v="student">Student's or parent's phone</button>
  </div>
  <span class="night" id="night"></span>
  <span class="sp"></span>
  <button class="btn ghost small" data-act="classmates" title="Classmates answer the open questions">Classmates answer</button>
  <button class="btn small" data-act="nextNight">Next night ›</button>
  <label class="chk" title="Teacher Pro unlocks more classes and the question bank"><input type="checkbox" data-act="pro"> Pro</label>
  <button class="mini" data-act="theme">Theme</button>
  <button class="mini" data-act="export">Export</button>
  <button class="mini" data-act="import">Import</button>
  <button class="mini" data-act="reset">Reset</button>
</div>
<main class="wrap" id="app"></main>

<script>
// ---------- data ----------
const KEY = 'did-i-class-play-v1'
const START = new Date(2026, 9, 5) // a Monday
const STATUS = { did: 'Did', didnt: "Didn't", excused: 'Excused', open: 'Not yet' }
const COLORS = ['#c9f24d', '#8fb3ff', '#ffb36b', '#ff8fc7', '#7ee0c3', '#c9a7ff']
const HANDLES = ['Blue Heron', 'Red Fox', 'Quiet Otter', 'Green Finch', 'Swift Hare', 'Gold Moth', 'Grey Wolf', 'Small Bear', 'Pine Marten', 'Sea Lion', 'Night Owl', 'River Toad', 'Snow Crab', 'Field Mouse', 'Iron Crow', 'Sand Wren', 'Brook Trout', 'Moss Newt', 'Plum Jay', 'Dusk Bat']
const BANK = [
  ['Practice', ['practice for 20 minutes', 'warm up with scales', 'record one run-through']],
  ['Reading', ['read for 20 minutes', 'finish tonight\'s chapter', 'write one line about what you read']],
  ['Homework', ['finish tonight\'s problem set', 'check your answers', 'pack your bag for tomorrow']],
  ['Bring to class', ['get the permission slip signed', 'pack your gym kit', 'charge your laptop']],
  ['Check-in', ['understand today\'s lesson', 'feel ready for Friday\'s test']],
]
const WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']

function seed() {
  const students = HANDLES.slice(0, 18).map((name, i) => ({ id: 's' + i, name }))
  const me = { id: 'me', name: 'You' }
  return {
    role: 'teacher', day: 0, pro: false,
    students: [...students, me],
    classes: [{ id: 'c1', name: 'Piano studio', section: 'Tuesday group', color: COLORS[0], code: 'PNO-4KX7', approve: false, mode: 'students', members: [...students.slice(0, 11).map((s) => s.id), 'me'], pending: [] },
      { id: 'c2', name: '2nd grade reading', section: 'Room 14', color: COLORS[3], code: 'RDG-7MQ2', approve: false, mode: 'parents', members: students.slice(6, 18).map((s) => s.id), pending: [] }],
    questions: [{ id: 'q1', classId: 'c1', text: 'practice for 20 minutes', day: 0, repeat: 'weekdays', days: [1, 2, 3, 4, 5], due: null, late: true, anon: false, link: '', gone: false }, { id: 'q2', classId: 'c2', text: 'read together for 15 minutes', day: 0, repeat: 'weekdays', days: [1, 2, 3, 4, 5], due: null, anon: false, link: '', gone: false }],
    // (the parents class gets its nightly reading question below)
    answers: {}, excused: {}, extend: {}, reminded: {},
    mine: { joined: ['c1'], names: { c1: 'You' }, streakOn: {}, muted: {}, inbox: [], personal: [{ id: 'p1', text: 'take my vitamins' }, { id: 'p2', text: 'lock the back door' }], pAnswers: {} },
    teacherClass: 'c1', studentTab: 'tonight',
  }
}
let S
try { S = JSON.parse(localStorage.getItem(KEY)) } catch { S = null }
if (!S || !S.classes) S = seed()
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch {} }

// ---------- night math ----------
const dateOf = (n) => { const d = new Date(START); d.setDate(d.getDate() + n); return d }
const wd = (n) => dateOf(n).getDay()
const label = (n) => dateOf(n).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const cls = (id) => S.classes.find((c) => c.id === id)
const stu = (id) => S.students.find((s) => s.id === id)
// Parents classes never name or involve a child: the adult answers for the household.
const parents = (c) => c && c.mode === 'parents'
const who = (c, n) => (parents(c) ? (n === 1 ? 'family' : 'families') : n === 1 ? 'student' : 'students')
const lead = (c) => (parents(c) ? 'Did we' : 'Did I')

// One "instance" of a question: the night it belongs to. A due-by question has
// one instance (its ask night) that stays open until the due night.
function instancesOn(q, n) {
  if (q.gone || n < q.day) return []
  if (q.repeat === 'none') return n <= (q.due ?? q.day) ? [q.day] : []
  return q.days.includes(wd(n)) ? [n] : []
}
function lastNight(q, inst, sid) { return (q.repeat === 'none' ? (q.due ?? q.day) : inst) + (S.extend[q.id + '|' + sid] || 0) }
function statusOf(q, inst, sid, now = S.day) {
  const k = q.id + '|' + inst + '|' + sid
  if (S.excused[k]) return 'excused'
  const a = S.answers[k]
  if (a === 'did') return 'did'
  return now <= lastNight(q, inst, sid) ? 'open' : 'didnt'
}
// Every instance a class has asked up to and including night n.
function pastInstances(q, n) {
  const out = []
  if (q.repeat === 'none') { if (!q.gone && q.day <= n) out.push(q.day); return out }
  for (let i = q.day; i <= n; i++) if (!q.gone && q.days.includes(wd(i))) out.push(i)
  return out
}

// ---------- student helpers ----------
const myClasses = () => S.mine.joined.map(cls).filter(Boolean)
function myTonight() {
  const rows = []
  for (const c of myClasses()) for (const q of S.questions.filter((x) => x.classId === c.id)) {
    for (const inst of instancesOn(q, S.day)) if (statusOf(q, inst, 'me') === 'open' && S.answers[q.id + '|' + inst + '|me'] !== 'nope') rows.push({ kind: 'class', q, inst, c })
  }
  for (const p of S.mine.personal) if (!(p.id + '|' + S.day in S.mine.pAnswers)) rows.push({ kind: 'mine', p })
  return rows
}
function myDue() {
  let n = 0, done = 0
  for (const c of myClasses()) for (const q of S.questions.filter((x) => x.classId === c.id)) for (const inst of instancesOn(q, S.day)) { n++; if (['did', 'excused'].includes(statusOf(q, inst, 'me'))) done++ }
  for (const p of S.mine.personal) { n++; if (S.mine.pAnswers[p.id + '|' + S.day] === 'did') done++ }
  return { n, done }
}
// School-night streak: only weekday nights count, and three shields cover a miss each.
function myStreak() {
  let streak = 0, used = 0
  const counted = myClasses().filter((c) => S.mine.streakOn[c.id])
  for (let n = 0; n <= S.day; n++) {
    if (wd(n) === 0 || wd(n) === 6) continue
    const insts = []
    for (const c of counted) for (const q of S.questions.filter((x) => x.classId === c.id)) for (const i of instancesOn(q, n)) insts.push([q, i])
    for (const p of S.mine.personal) insts.push(['p', p, n])
    if (!insts.length) continue
    const ok = insts.every((x) => x[0] === 'p' ? S.mine.pAnswers[x[1].id + '|' + x[2]] === 'did' : ['did', 'excused'].includes(statusOf(x[0], x[1], 'me')))
    if (ok) streak++
    else if (n === S.day) continue // tonight is not over yet
    else if (used < 3) used++
    else streak = 0
  }
  return { streak, used }
}

// ---------- teacher view ----------
function teacherView() {
  const c = cls(S.teacherClass) || S.classes[0]
  const atLimit = !S.pro && S.classes.length >= 1
  const left = `<div class="card"><span class="k">Your classes</span><div class="list">
    ${S.classes.map((x) => { const t = classTonight(x); return `<button class="item ${c && x.id === c.id ? 'on' : ''}" data-act="pickClass" data-id="${x.id}"><i class="sw" style="background:${x.color}"></i><span class="grow"><b>${esc(x.name)}</b><span class="dim">${esc(x.section || '')} · ${x.members.length} ${who(x)}${parents(x) ? ' · parents answer' : ''}${x.pending.length ? ' · ' + x.pending.length + ' waiting' : ''}</span></span><span class="dim">${t.n ? t.did + '/' + t.n : ''}</span></button>` }).join('') || '<div class="empty">No classes yet. Make one below.</div>'}
  </div>
  <details ${S.classes.length ? '' : 'open'}><summary class="soft" style="cursor:pointer">+ New class ${atLimit ? '<span class="pro">PRO</span>' : ''}</summary>
    <form data-form="newClass" class="list" style="margin-top:10px">
      <label class="f">Name<input type="text" name="name" maxlength="40" required placeholder="Biology"></label>
      <label class="f">Section (optional)<input type="text" name="section" maxlength="30" placeholder="Period 3"></label>
      <label class="f">Who answers<select name="mode"><option value="students">Students (13 and older)</option><option value="parents">Parents and guardians (any grade)</option></select></label>
      <div class="row">${COLORS.map((col, i) => `<label><input type="radio" name="color" value="${col}" ${i === 1 ? 'checked' : ''} hidden><i class="sw" style="background:${col};width:22px;height:22px;display:block;cursor:pointer;outline:${i === 1 ? '2px solid var(--ink)' : 'none'}"></i></label>`).join('')}</div>
      ${atLimit ? '<p class="soft">Free teachers get one class. Turn on Pro in the top bar to make more.</p>' : ''}
      <button class="btn" ${atLimit ? 'disabled' : ''}>Make class</button>
    </form></details></div>`
  const side = `<div class="list"><div class="card"><span class="k">Where this lives</span><p class="soft">The teacher uses the same Did I app. Each class is answered by students (13 and older) or by parents (any grade, no child involved). <b>Teaching</b> shows up in the menu once they make a class (or tap "I teach a class"). Their own questions stay on Home and never mix with Teaching.</p><p class="soft">The heavier tools (question bank, plan the week, term grid, export) are also on did-i.app for a laptop.</p></div></div>`
  const t = S.tScreen || 'teaching'
  let screen
  if (t === 'home') screen = homeBar('tscreen') + `<div class="hd"><span>DID I · ${label(S.day).toUpperCase()}</span></div><div class="sheet"><span class="tag">Your questions</span><div class="rrow"><span class="grow">Did I grade the quizzes?</span></div><div class="rrow"><span class="grow">Did I water the plants?</span></div></div><p class="note">The teacher's own Did I. Open the menu for Teaching.</p><div class="nav"><button class="on">Home</button><button>Questions</button></div>`
  else if (t === 'menu') screen = backBar('Menu', 'home', 'tscreen') + `<div class="menu"><button class="stub"><span>Friends</span></button><button class="stub"><span>Shop</span></button><button class="stub"><span>Stats</span></button><button data-act="tscreen" data-v="teaching"><span>Teaching · ${S.classes.length} class${S.classes.length === 1 ? '' : 'es'}</span><i class="new">NEW</i></button><button class="stub"><span>Settings</span></button></div><p class="note">Grey items stand in for the menu you already have.</p>`
  else if (!c || t === 'teaching') screen = backBar('Teaching', 'menu', 'tscreen') + left
  else if (t === 'class') screen = backBar(esc(c.name), 'teaching', 'tscreen') + classHome(c)
  else if (t === 'ask') screen = backBar('Ask', 'class', 'tscreen') + askCard(c)
  else if (t === 'join') screen = backBar('Join code', 'class', 'tscreen') + joinCard(c)
  else if (t === 'settings') screen = backBar('Class settings', 'class', 'tscreen') + settingsCard(c)
  else if (t.startsWith('q:')) { const q = S.questions.find((x) => x.id === t.slice(2)); screen = backBar('Who did it', 'class', 'tscreen') + (q && !q.gone ? qBlock(c, q, true) : '<div class="empty">That question was taken back.</div>') }
  return `<div class="cols">${side}<div class="phone">${screen}</div></div>`
}
function classHome(c) {
  const qs = S.questions.filter((q) => q.classId === c.id && !q.gone)

  return { n, did }

function qrFor(code) {
  let h = 7; for (const ch of code) h = (h * 31 + ch.charCodeAt(0)) >>> 0
  let cells = ''
  for (let i = 0; i < 144; i++) { h = (h * 1103515245 + 12345) >>> 0; const r = Math.floor(i / 12), col = i % 12; const corner = (r < 3 && col < 3) || (r < 3 && col > 8) || (r > 8 && col < 3); cells += `<i class="${corner ? (r % 2 || col % 2 ? '' : '') : ((h >>> 16) & 1 ? "" : "w")}"></i>` }
  return `<div class="qr" aria-label="QR code (demo)">${cells}</div>`
}

function wireAsk() {
  const f = document.querySelector('[data-form="ask"]')
  if (!f) return
  const upd = () => {
    const c = cls(S.teacherClass)
    const rep = f.repeat.value
    f.querySelector('[data-days]').style.display = rep === 'days' ? '' : 'none'
    const t = f.text.value.trim() || '…'
    const when = rep === 'none' ? 'tonight' : rep === 'weekdays' ? 'every school night' : [...f.querySelectorAll('[name=d]:checked')].map((x) => WEEK[x.value]).join(', ') || 'no days picked'
    f.querySelector('[data-preview]').textContent = `${c.members.length} ${who(c)} get "${lead(c)} ${t}?" ${when}${f.due.value !== '0' && rep === 'none' ? ', due in ' + f.due.value + ' nights' : ''}.${f.anon.checked ? ' Anonymous: totals only.' : ''}`
  }
  f.addEventListener('input', upd); upd()
}

// ---------- swipe ----------
function wireSwipe() {
  const card = document.getElementById('top')
  if (!card) return
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  let x0 = null, dx = 0
  card.addEventListener('pointerdown', (e) => { if (e.target.closest('.tag')) return; x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.classList.add('drag') })
  card.addEventListener('pointermove', (e) => {
    if (x0 === null) return
    dx = e.clientX - x0
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`
    card.querySelector('.stamp.did').style.opacity = Math.max(0, dx / 100)
    card.querySelector('.stamp.nope').style.opacity = Math.max(0, -dx / 100)
  })
  const end = () => {
    if (x0 === null) return
    x0 = null; card.classList.remove('drag')
    if (Math.abs(dx) > 90) fly(dx > 0 ? 'did' : 'nope')
    else { card.style.transform = ''; card.querySelectorAll('.stamp').forEach((s) => (s.style.opacity = 0)) }
  }
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end)
  window.fly = (v) => {
    if (reduce) return answer(v)
    card.style.transform = `translateX(${v === 'did' ? 420 : -420}px) rotate(${v === 'did' ? 20 : -20}deg)`
    card.style.opacity = 0
    setTimeout(() => answer(v), 220)
  }
}
function answer(v) {
  const top = myTonight()[0]
  if (!top) return
  if (top.kind === 'mine') S.mine.pAnswers[top.p.id + '|' + S.day] = v
  else {
    S.answers[top.q.id + '|' + top.inst + '|me'] = v === 'did' ? 'did' : 'nope'
  }
  render()
}

// ---------- classmates ----------
function classmatesAnswer() {
  for (const c of S.classes) for (const q of S.questions.filter((x) => x.classId === c.id)) for (const inst of instancesOn(q, S.day)) for (const sid of c.members) {
    if (sid === 'me') continue
    const k = q.id + '|' + inst + '|' + sid
    if (S.answers[k] || S.excused[k]) continue
    const r = Math.random()
    if (r < 0.72) S.answers[k] = 'did'
    else if (r < 0.82) S.answers[k] = 'nope'
  }
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]')
  if (!b || b.tagName === 'INPUT') return
  const a = b.dataset.act
  const c = cls(S.teacherClass)
  if (a === 'role') S.role = b.dataset.v
  else if (a === 'nextNight') { classmatesAnswer(); S.day++; S.mine.inbox = S.mine.inbox.slice(-6) }
  else if (a === 'classmates') classmatesAnswer()
  else if (a === 'theme') { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light'; return }
  else if (a === 'export') {
    const text = JSON.stringify(S)
    navigator.clipboard?.writeText(text).then(() => { b.textContent = 'Copied' }, () => prompt('Copy this text:', text))
    return
  }
  else if (a === 'import') {
    const text = prompt('Paste text from Export in the other browser:')
    if (!text) return
    try {
      const next = JSON.parse(text)
      if (!next || !Array.isArray(next.classes) || !next.mine) throw new Error('shape')
      if (!confirm('Replace this playground with the pasted one?')) return
      S = next
    } catch { alert('That text is not a playground export.'); return }
  }
  else if (a === 'reset') { if (!confirm('Reset the playground? Everything you made goes away.')) return; S = seed() }
  else if (a === 'pickClass') { S.teacherClass = b.dataset.id; S.tScreen = 'class' }
  else if (a === 'copy') { navigator.clipboard?.writeText(b.dataset.v).catch(() => {}); b.textContent = 'Copied'; return }
  else if (a === 'newCode') { if (!confirm('Make a new code? The old one stops working.')) return; c.code = makeCode(c.name) }
  else if (a === 'approve') { c.pending = c.pending.filter((x) => x !== b.dataset.id); c.members.push(b.dataset.id); if (b.dataset.id === 'me') { S.mine.joined.push(c.id); S.mine.inbox.push(`You're in ${c.name}.`) } }
  else if (a === 'deny') { c.pending = c.pending.filter((x) => x !== b.dataset.id); if (b.dataset.id === 'me') S.mine.inbox.push(`Your teacher didn't let you into ${c.name}.`) }
  else if (a === 'remind') {
    const q = S.questions.find((x) => x.id === b.dataset.id)
    S.reminded[q.id + '|' + S.day] = 1
    const inst = instancesOn(q, S.day)[0]
    if (c.members.includes('me') && statusOf(q, inst, 'me') === 'open' && !S.mine.muted[c.id]) S.mine.inbox.push(`${c.name}: ${lead(c)} ${q.text}?`)
  }
  else if (a === 'takeBack') { if (!confirm('Take this question back? It leaves everyone\'s tonight and never counts.')) return; S.questions.find((x) => x.id === b.dataset.id).gone = true; S.tScreen = 'class' }
  else if (a === 'excuse') S.excused[b.dataset.q + '|' + b.dataset.i + '|' + b.dataset.s] = 1
  else if (a === 'unexcuse') delete S.excused[b.dataset.q + '|' + b.dataset.i + '|' + b.dataset.s]
  else if (a === 'extend') { const k = b.dataset.q + '|' + b.dataset.s; S.extend[k] = (S.extend[k] || 0) + 2 }
  else if (a === 'addStudents') { const have = S.students.length; HANDLES.slice(0).forEach(() => {}); for (let i = 0; i < 5; i++) { const id = 's' + (have + i); S.students.push({ id, name: HANDLES[(have + i) % HANDLES.length] + ' ' + (Math.floor((have + i) / HANDLES.length) + 2) }); c.members.push(id) } }
  else if (a === 'deleteClass') { if (!confirm(`Delete ${c.name}? It removes the class and all its answers for everyone.`)) return; S.classes = S.classes.filter((x) => x !== c); S.questions = S.questions.filter((q) => q.classId !== c.id); S.mine.joined = S.mine.joined.filter((x) => x !== c.id); S.teacherClass = S.classes[0]?.id; S.tScreen = 'teaching' }
  else if (a === 'bank') { if (!S.pro) { alert('The question bank is a Teacher Pro feature. Turn on Pro in the top bar to try it.'); return } const box = document.querySelector('[data-bankbox]'); box.innerHTML = BANK.map(([t, qs]) => `<div style="margin-top:8px"><span class="dim">${t}</span><div class="row" style="margin-top:4px">${qs.map((q) => `<button type="button" class="btn ghost small" data-act="useBank" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`).join(''); return }
  else if (a === 'useBank') { const f = document.querySelector('[data-form="ask"]'); f.text.value = b.dataset.v; f.dispatchEvent(new Event('input')); return }
  else if (a === 'stab') { if (b.dataset.v.startsWith('class:') && !S.studentTab.startsWith('class:')) S.classBack = S.studentTab; S.studentTab = b.dataset.v }
  else if (a === 'tscreen') S.tScreen = b.dataset.v
  else if (a === 'answer') { window.fly ? window.fly(b.dataset.v) : answer(b.dataset.v); return }
  else if (a === 'leave') { const lc = cls(b.dataset.id); if (!confirm(`Leave ${lc.name}? Its questions leave your tonight.`)) return; S.mine.joined = S.mine.joined.filter((x) => x !== lc.id); lc.members = lc.members.filter((x) => x !== 'me'); S.studentTab = 'classes' }
  else if (a === 'clearInbox') S.mine.inbox = []
  else if (a === 'classDid') S.answers[b.dataset.q + '|' + b.dataset.i + '|me'] = 'did'
  else if (a === 'join') {
    const jc = cls(b.dataset.id)
    const f = document.querySelector('[data-form="joinConfirm"]')
    if (!f.age.checked) { document.querySelector('[data-agehint]').textContent = parents(jc) ? 'Only a parent or guardian can join this class.' : 'Did I Class is for people 13 and older. If you are younger, ask your teacher about another way to take part.'; return }
    S.mine.names[jc.id] = f.name.value.trim().slice(0, 30) || 'You'
    if (jc.approve) { jc.pending.push('me'); S.mine.inbox.push(`Asked to join ${jc.name}.`) } else { jc.members.push('me'); S.mine.joined.push(jc.id); S.mine.inbox.push(`You're in ${jc.name}.`); S.studentTab = 'tonight' }
  }
  else return
  render()
})
document.addEventListener('change', (e) => {
  const t = e.target, a = t.dataset.act
  if (a === 'pro') S.pro = t.checked
  else if (a === 'approveToggle') cls(S.teacherClass).approve = t.checked
  else if (a === 'streakOn') S.mine.streakOn[t.dataset.id] = t.checked
  else if (a === 'mute') S.mine.muted[t.dataset.id] = t.checked
  else if (t.name === 'color') { t.closest('.row').querySelectorAll('.sw').forEach((s) => (s.style.outline = 'none')); t.nextElementSibling.style.outline = '2px solid var(--ink)'; return }
  else return
  render()
})
document.addEventListener('submit', (e) => {
  e.preventDefault()
  const f = e.target, kind = f.dataset.form
  if (kind === 'newClass') {
    const id = 'c' + Date.now().toString(36)
    S.classes.push({ id, name: f.name.value.trim(), section: f.section.value.trim(), color: f.color.value, code: makeCode(f.name.value), approve: false, mode: f.mode.value, members: S.students.filter((s) => s.id !== 'me').slice(0, 8).map((s) => s.id), pending: [] })
    S.teacherClass = id; S.tScreen = 'join'
  } else if (kind === 'ask') {
    const rep = f.repeat.value
    const days = rep === 'weekdays' ? [1, 2, 3, 4, 5] : rep === 'days' ? [...f.querySelectorAll('[name=d]:checked')].map((x) => +x.value) : []
    if (rep === 'days' && !days.length) { alert('Pick at least one day.'); return }
    let link = f.link.value.trim()
    if (link && !/^https:\/\//.test(link)) { alert('Links must start with https://'); return }
    S.questions.push({ id: 'q' + Date.now().toString(36), classId: S.teacherClass, text: f.text.value.trim().replace(/\?$/, ''), day: S.day, repeat: rep, days, due: rep === 'none' ? S.day + +f.due.value : null, anon: f.anon.checked, link, gone: false }); S.tScreen = 'class'
  } else if (kind === 'lookup') {
    const code = f.code.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '')
    const c = S.classes.find((x) => x.code.replace('-', '') === code)
    const box = document.querySelector('[data-joinbox]')
    if (!c) { box.innerHTML = '<div class="toast">No class with that code. Check the letters with your teacher.</div>'; return }
    if (S.mine.joined.includes(c.id)) { box.innerHTML = `<div class="toast">You're already in ${esc(c.name)}.</div>`; return }
    box.innerHTML = `<form data-form="joinConfirm" class="sheet" onsubmit="return false"><div class="row"><i class="sw" style="background:${c.color}"></i><h3>${esc(c.name)}</h3></div><span class="dim">${esc(c.section || '')} · ${c.members.length} ${who(c)}</span>
      <div class="promise">${parents(c) ? 'The teacher sees only whether your family answered' : 'Your teacher sees only whether you answered class questions'} (Did, Didn't, Excused, Not yet). Not when, not your own questions, not your streak. ${parents(c) ? "Other families see nothing about you." : "Classmates see nothing about you."}</div>
      ${parents(c) ? '<div class="promise">This class is answered by parents and guardians. Your child never uses Did I and is never named here.</div>' : ''}
      <label class="f">${parents(c) ? 'Your name (yours, not your child’s)' : 'Your name in this class'}<input type="text" name="name" maxlength="30" value="You"></label>
      <label class="chk"><input type="checkbox" name="age"> ${parents(c) ? 'I’m a parent or guardian, 18 or older' : 'I’m 13 or older'}</label><span class="dim" data-agehint></span>
      <button type="button" class="btn" data-act="join" data-id="${c.id}">Join ${esc(c.name)}</button></form>`
    return
  }
  render()
})
function makeCode(name) {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'
  const head = (name.replace(/[^A-Za-z]/g, '').toUpperCase() + 'CLS').replace(/[IO]/g, 'X').slice(0, 3)
  let tail = ''; for (let i = 0; i < 4; i++) tail += A[Math.floor(Math.random() * A.length)]
  return head + '-' + tail
}
render()
</script>
</body></html>
