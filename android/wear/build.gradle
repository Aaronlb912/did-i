// Same AGP and Kotlin as the phone app (React Native's gradle plugin catalog).
plugins {
  id 'com.android.application' version '8.12.0'
  id 'org.jetbrains.kotlin.android' version '2.1.20'
  id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}

// Same upload key as the phone app (android-apk.yml sets these).
def releaseKeystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseKeystore = releaseKeystoreFile && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
  namespace 'com.aaronbryant.didi.wear'
  compileSdk 36

  defaultConfig {
    // Same package as the phone app: Play pairs them in one listing.
    applicationId 'com.aaronbryant.didi'
    minSdk 30
    targetSdk 36
    // Play needs a different versionCode from the phone bundle in the same
    // release, so the watch takes 1,000,000,000 + the run number.
    versionCode 1000000000 + ((System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger())
    versionName "1.3.8"
  }

  if (hasReleaseKeystore) {
    signingConfigs {
      release {
        storeFile file(releaseKeystoreFile)
        storePassword releaseKeystorePassword
        keyAlias releaseKeyAlias
        keyPassword releaseKeyPassword
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (hasReleaseKeystore) signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  buildFeatures {
    compose true
  }
}

dependencies {
  implementation platform('androidx.compose:compose-bom:2024.12.01')
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.wear.compose:compose-material:1.4.0'
  implementation 'androidx.wear.compose:compose-foundation:1.4.0'
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
  // tiles 1.4 reads a settings key that targetSdk 35+ may not read, so tile
  // updates failed on Wear OS 5 (SecurityException in requestUpdate).
  implementation 'androidx.wear.tiles:tiles:1.5.0'
  implementation 'androidx.wear.protolayout:protolayout:1.3.0'
  implementation 'androidx.wear.protolayout:protolayout-material:1.3.0'
  implementation 'com.google.guava:guava:33.3.1-android'
}
