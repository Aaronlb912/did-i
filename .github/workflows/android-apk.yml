name: android-apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            keystore="${RUNNER_TEMP}/release.keystore"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${keystore}"
            echo "ANDROID_KEYSTORE_FILE=${keystore}" >> "${GITHUB_ENV}"
            echo "mode=release" >> "${GITHUB_OUTPUT}"
            echo "label=release APK, release signature" >> "${GITHUB_OUTPUT}"
            echo "Release keystore secrets are set. Signing the release APK with that key."
          else
            keytool -genkeypair \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=debug" >> "${GITHUB_OUTPUT}"
            echo "label=release APK, debug signature" >> "${GITHUB_OUTPUT}"
            echo "Release keystore secrets are absent. Signing the release APK with a debug key."
          fi

      - name: Give Gradle more heap
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set."
            exit 1
          fi
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > android/local.properties

      - name: Assemble release APK (debug signature)
        if: steps.signing.outputs.mode == 'debug'
        working-directory: android
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Assemble release APK (release signature)
        if: steps.signing.outputs.mode == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: did-i-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Summarize
        run: |
          echo "### Android APK" >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ steps.signing.outputs.label }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Download did-i-android-apk from this run." >> "${GITHUB_STEP_SUMMARY}"
