name: android-apk

on:
  workflow_dispatch:
    inputs:
      run_check:
        description: Run npm run check before assemble (push/PR already run check.yml)
        type: boolean
        default: true

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Play refuses an upload whose versionCode is not higher than the last one.
  ANDROID_VERSION_CODE: ${{ github.run_number }}

jobs:
  apk:
    name: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        if: inputs.run_check != false
        run: npm run check

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle (project + native + build cache)
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            android/app/.cxx
            ~/.gradle/caches/build-cache-1
          key: gradle-ci-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json', 'app.config.js', 'native/**', 'widgets/**') }}
          restore-keys: |
            gradle-ci-${{ runner.os }}-

      - name: Prepare signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            keystore="${RUNNER_TEMP}/release.keystore"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${keystore}"
            echo "ANDROID_KEYSTORE_FILE=${keystore}" >> "${GITHUB_ENV}"
            echo "mode=release" >> "${GITHUB_OUTPUT}"
            echo "label=release APK, release signature" >> "${GITHUB_OUTPUT}"
            echo "Release keystore secrets are set. Signing the release APK with that key."
          else
            keytool -genkeypair \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=debug" >> "${GITHUB_OUTPUT}"
            echo "label=release APK, debug signature" >> "${GITHUB_OUTPUT}"
            echo "Release keystore secrets are absent. Signing the release APK with a debug key."
          fi

      - name: Configure Gradle for CI
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set."
            exit 1
          fi
          {
            printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n'
            printf 'org.gradle.caching=true\n'
            printf 'org.gradle.parallel=true\n'
            printf 'org.gradle.vfs.watch=false\n'
            printf 'org.gradle.workers.max=%s\n' "$(nproc)"
            printf 'kotlin.incremental=true\n'
            printf 'sdk.dir=%s\n' "${ANDROID_HOME}"
          } >> android/gradle.properties

      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:assembleRelease --build-cache --no-scan -x lint -x test -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: did-i-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Play only takes a bundle signed with the release (upload) key, so this
      # runs only when the keystore secrets are set. All ABIs, unlike the APK.
      - name: Bundle release AAB (Play)
        if: steps.signing.outputs.mode == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:bundleRelease --build-cache --no-scan -x lint -x test

      - name: Upload AAB
        if: steps.signing.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: did-i-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Summarize
        run: |
          echo "### Android APK" >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ steps.signing.outputs.label }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "ABI: arm64-v8a only (phone installs). Download did-i-android-apk from this run." >> "${GITHUB_STEP_SUMMARY}"
          echo "versionCode: ${ANDROID_VERSION_CODE}" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            echo "Play bundle: did-i-android-aab (all ABIs)." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No Play bundle: add the four ANDROID_KEYSTORE / ANDROID_KEY secrets first." >> "${GITHUB_STEP_SUMMARY}"
          fi
