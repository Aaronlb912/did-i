name: ota update

# Publishes the JS bundle to phones (expo-updates, production channel) after
# each push to master, so a merged shop drop reaches users with no manual step.
# Dated items stay hidden until their day (src/lib/purse.js), so shipping early
# is safe. Native changes are skipped: those need a store build.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ota-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Native code or a new native package cannot go out over the air; a phone
      # on the old build would load JS that expects code it does not have.      - name: Skip native changes
        id: native
        run: |
          changed="$(git diff --name-only HEAD~1 HEAD || true)"
          if echo "$changed" | grep -Eq '^(android/|ios/|app\.json$|app\.config\.js$|eas\.json$|package\.json$|package-lock\.json$|widgets/DidITonightWidget\.tsx$)'; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "Native files changed; this needs a store build, not an update." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.native.outputs.skip != '1'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.native.outputs.skip != '1'
        run: npm ci

      - name: Check
        if: steps.native.outputs.skip != '1'
        run: npm run check

      - name: Publish update
        if: steps.native.outputs.skip != '1'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "No EXPO_TOKEN secret; add one (expo.dev > Access tokens) to publish updates." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npx eas-cli update --channel production --environment production --non-interactive --message "$(git log -1 --pretty=%s)"
          echo "Published to production: $(git log -1 --pretty=%s)" >> "$GITHUB_STEP_SUMMARY"
