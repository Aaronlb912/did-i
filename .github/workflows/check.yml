name: check

# PRs only: the merge to master is the same code the PR run checked.
on:
  # Manual only: PRs are gated locally (npm test, N of N passed) so they spend no Actions minutes.
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
