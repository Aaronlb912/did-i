name: iOS IPA

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir .expo-export-ios

      - name: Prebuild iOS (widgets)
        run: npx expo prebuild --platform ios --no-install
        env:
          EAS_INCLUDE_WIDGETS: '1'

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace DidI.xcworkspace \
            -scheme DidI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DidI.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: did-i-ios-unsigned-archive
          path: ${{ runner.temp }}/DidI.xcarchive
          if-no-files-found: error
