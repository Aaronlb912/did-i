name: iOS IPA

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    env:
      EAS_INCLUDE_WIDGETS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: GoogleService-Info.plist (secret)
        env:
          GOOGLE_SERVICES_PLIST: ${{ secrets.GOOGLE_SERVICES_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICES_PLIST" ]; then
            echo "$GOOGLE_SERVICES_PLIST" | base64 --decode > GoogleService-Info.plist
          fi

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir .expo-export-ios

      - name: Prebuild iOS (widgets)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Import signing certificate and profiles
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_WIDGET_PROVISIONING_PROFILE: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE }}
        run: bash .github/scripts/ios-signing.sh

      - name: Build unsigned archive
        if: env.SIGNING != '1'
        working-directory: ios
        run: |
          xcodebuild \
            -workspace DidI.xcworkspace \
            -scheme DidI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DidI.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Build signed archive
        if: env.SIGNING == '1'
        working-directory: ios
        run: |
          xcodebuild \
            -workspace DidI.xcworkspace \
            -scheme DidI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DidI.xcarchive" \
            archive \
            DEVELOPMENT_TEAM=2ZUKFKSSV8 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export signed IPA
        if: env.SIGNING == '1'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DidI.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload unsigned archive
        if: env.SIGNING != '1'
        uses: actions/upload-artifact@v4
        with:
          name: did-i-ios-unsigned-archive
          path: ${{ runner.temp }}/DidI.xcarchive
          if-no-files-found: error

      - name: Upload signed IPA
        if: env.SIGNING == '1'
        uses: actions/upload-artifact@v4
        with:
          name: did-i-ios-testflight-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: env.SIGNING == '1'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_P8" ]; then
            echo "App Store Connect API secrets not set; IPA is in workflow artifacts only (no TestFlight upload)."
            exit 0
          fi
          IPA="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "No IPA found after export."
            exit 1
          fi
          KEY_DIR="${HOME}/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode > "${KEY_DIR}/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded to App Store Connect for TestFlight processing (not submitted for App Store review)."
