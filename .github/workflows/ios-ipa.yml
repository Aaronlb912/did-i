name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      run_check:
        description: Run npm run check before export (push/PR already run check.yml)
        type: boolean
        default: true
      dev_app:
        description: Build "Did I Dev" (com.aaronbryant.didi.dev), a dev client for npm run expo:dev
        type: boolean
        default: false

concurrency:
  group: ios-ipa-${{ github.ref }}-${{ inputs.dev_app }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EAS_INCLUDE_WIDGETS: '1'
      DIDI_DEV: ${{ inputs.dev_app && '1' || '0' }}
      # Turn on (repo variable DIDI_UNIVERSAL_LINKS=1) once the App ID has
      # Associated Domains and the provisioning profiles are remade.
      DIDI_UNIVERSAL_LINKS: ${{ vars.DIDI_UNIVERSAL_LINKS || '0' }}
      # The dev client loads JS from Metro, so it builds Debug (Release strips the dev launcher).
      XCODE_CONFIG: ${{ inputs.dev_app && 'Debug' || 'Release' }}
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 57 needs Swift 6.2 (Xcode 26). Use the newest Xcode on the image.
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Take the next iOS build number
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          node scripts/ios-bump-build.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check
        if: inputs.run_check != false
        run: npm run check

      - name: GoogleService-Info.plist (secret)
        env:
          GOOGLE_SERVICES_PLIST: ${{ secrets.GOOGLE_SERVICES_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICES_PLIST" ]; then
            echo "$GOOGLE_SERVICES_PLIST" | base64 --decode > GoogleService-Info.plist
          fi

      - name: Cache Expo iOS export
        uses: actions/cache@v4
        id: expo-export-cache
        with:
          path: .expo-export-ios
          key: expo-ios-export-${{ hashFiles('package-lock.json', 'app.config.js') }}-${{ hashFiles('src/**', 'native/**', 'widgets/**') }}
          restore-keys: |
            expo-ios-export-${{ hashFiles('package-lock.json', 'app.config.js') }}-
            expo-ios-export-

      - name: Export iOS bundle
        if: steps.expo-export-cache.outputs.cache-hit != 'true' && env.DIDI_DEV != '1'
        run: npx expo export --platform ios --output-dir .expo-export-ios

      - name: Prebuild iOS (widgets)
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json', 'ios/Podfile', 'ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          set -euo pipefail
          if [ -d Pods ] && [ -f Podfile.lock ] && pod install --deployment; then
            echo "Pods installed from cache (deployment)."
          else
            pod install
          fi

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('package-lock.json', 'app.config.js', 'ios/Podfile', 'ios/Podfile.lock') }}-${{ hashFiles('src/**', 'native/**', 'widgets/**') }}
          restore-keys: |
            ${{ runner.os }}-derived-${{ hashFiles('package-lock.json', 'app.config.js') }}-
            ${{ runner.os }}-derived-

      - name: Import signing certificate and profiles
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ inputs.dev_app && secrets.IOS_DEV_PROVISIONING_PROFILE || secrets.IOS_PROVISIONING_PROFILE }}
          IOS_WIDGET_PROVISIONING_PROFILE: ${{ !inputs.dev_app && secrets.IOS_WIDGET_PROVISIONING_PROFILE || '' }}
        run: bash .github/scripts/ios-signing.sh

      - name: Assert iOS build number (TestFlight)
        if: env.SIGNING == '1'
        run: |
          BN="$(node -p "require('./app.json').expo.ios.buildNumber || '1'")"
          if [ "$BN" -le 52 ] 2>/dev/null || [ "$BN" = "1" ]; then
            echo "ios.buildNumber in app.json must be greater than the latest TestFlight build (52). Got: $BN"
            exit 1
          fi

      - name: Apply manual signing to Xcode project
        if: env.SIGNING == '1'
        run: ruby .github/scripts/ios-apply-manual-signing.rb

      - name: Build unsigned archive
        if: env.SIGNING != '1'
        working-directory: ios
        run: |
          xcodebuild \
            -workspace DidI.xcworkspace \
            -scheme DidI \
            -configuration "$XCODE_CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DidI.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Build signed archive
        if: env.SIGNING == '1'
        working-directory: ios
        run: |
          xcodebuild \
            -workspace DidI.xcworkspace \
            -scheme DidI \
            -configuration "$XCODE_CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DidI.xcarchive" \
            archive

      - name: Export signed IPA
        if: env.SIGNING == '1'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DidI.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload unsigned archive
        if: env.SIGNING != '1'
        uses: actions/upload-artifact@v4
        with:
          name: did-i-ios-unsigned-archive
          path: ${{ runner.temp }}/DidI.xcarchive
          if-no-files-found: error

      - name: Upload signed IPA
        if: env.SIGNING == '1'
        uses: actions/upload-artifact@v4
        with:
          name: did-i-ios-testflight-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: env.SIGNING == '1'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_P8" ]; then
            echo "App Store Connect API secrets not set; IPA is in workflow artifacts only (no TestFlight upload)."
            exit 0
          fi
          IPA="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "No IPA found after export."
            exit 1
          fi
          KEY_DIR="${HOME}/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode > "${KEY_DIR}/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded to App Store Connect for TestFlight processing (not submitted for App Store review)."
