name: visual parity

# PRs that can change what the website draws; not SQL, docs or Android.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'supabase/**'
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run visual
